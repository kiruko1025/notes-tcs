site_name: notes
docs_dir: src
site_dir: out

theme:
  name: readthedocs
  collapse_navigation: true   # section headings only for the current lecture
  navigation_depth: 4        # course, lecture, section, subsection
  sticky_navigation: true   
  highlightjs: true
  hljs_languages:
    - yaml
    - rust

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - tables
  - extra
  - def_list
  - toc:
      permalink: ""
      separator: "_"
  - admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Mathematical Background:
      - Proof Writing: "Mathematical Background/proof-writing.md"
  - Algorithms:
      - Divide and Conquer: Algorithms/1-divide-and-conquer.md
      - Dynamic Programming: Algorithms/2-dynamic-programming.md
      - Greedy Method: Algorithms/3-greedy-method.md
  - Courses:
      - CSE574:
          - 2: CSE574/2.md
          - 3: CSE574/3.md
          - 4: CSE574/4.md
          - 5: CSE574/5.md
          - 6: CSE574/6.md
          - 7: CSE574/7.md
          - 8: CSE574/8.md
          - 9: CSE574/9.md
      - CSE590:
          - 2: CSE590/2.md
          - 3: CSE590/3.md
          - 4: CSE590/4.md
          - 5: CSE590/5.md
          - 6: CSE590/6.md
          - 7: CSE590/7.md
          - 8: CSE590/8.md
          - 9: CSE590/9.md
