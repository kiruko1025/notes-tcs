site_name: notes
docs_dir: src
site_dir: out

theme:
  name: readthedocs
  collapse_navigation: true   # enable collapsing
  navigation_depth: 3       # show nested levels (must be >1)
  sticky_navigation: true   
  highlightjs: true
  hljs_languages:
    - yaml
    - rust

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - tables
  - extra
  - def_list
  - toc:
      permalink: ""
      separator: "_"
  - admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Mathematical Background:
      - Proof Writing: "Mathematical Background/proof-writing.md"
  - Algorithms:
      - Divide and Conquer: Algorithms/1-divide-and-conquer.md
      - Dynamic Programming: Algorithms/2-dynamic-programming.md
      - Greedy Method: Algorithms/3-greedy-method.md
  - CSE574:
      - 1: CSE574/1.md
      - 2: CSE574/2.md
  - CSE590:
      - 1: CSE590/1.md
      - 2: CSE590/2.md
